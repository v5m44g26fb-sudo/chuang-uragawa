<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>担当をデビューさせる件｜学員サポートなおの裏側SNS</title>
<style>
:root{
--bg:#0b1526; --panel:#12233d; --panel2:#182c4c; --line:#24406b;
--txt:#eaf2ff; --sub:#9db6d9; --accent:#ffb84d; --accent2:#39d0c4;
--me:#ffe08a; --me-txt:#2a2008; --other:#1d3357; --pink:#ff8fb2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#050a16;color:var(--txt);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{display:flex;justify-content:center;min-height:100dvh}
#phone{width:100%;max-width:430px;min-height:100dvh;background:linear-gradient(180deg,#0d1e38,#081426);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:480px){#phone{min-height:932px;max-height:932px;border-radius:28px;border:1px solid #2a4a7f;margin:12px 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}}
#sb{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:12px;color:var(--sub)}
header.app-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(10,22,42,.85);position:sticky;top:0;z-index:5}
header.app-head h1{font-size:17px;margin:0;flex:1}
header.app-head.sub{font-size:11px;color:var(--sub)}
.backbtn{background:none;border:none;color:var(--accent2);font-size:22px;cursor:pointer;padding:0 4px}
main{flex:1;overflow-y:auto;position:relative}
.screen{display:none;padding:0 0 90px}
.screen.active{display:block}
/* home */
#home-hero{padding:22px 18px 8px}
#home-hero.date{color:var(--sub);font-size:12px}
#home-hero h2{margin:6px 0 4px;font-size:21px;line-height:1.4}
#home-hero p{color:var(--sub);font-size:13px;line-height:1.7;margin:4px 0}
#story-banner{margin:12px 16px;background:linear-gradient(135deg,#8a4b12,#b97a1e 55%,#d9a13b);border-radius:16px;padding:16px;color:#fff8ea;cursor:pointer;box-shadow:0 8px 22px rgba(217,161,59,.25)}
#story-banner.t{font-weight:700;font-size:16px}
#story-banner.d{font-size:12px;opacity:.92;margin-top:4px;line-height:1.6}
#story-banner.badge{display:inline-block;background:rgba(0,0,0,.28);border-radius:999px;padding:2px 10px;font-size:11px;margin-bottom:8px}
#apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:14px 16px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;background:none;border:none;color:var(--txt)}
.appicon.ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;background:var(--panel2);border:1px solid var(--line)}
.appicon span{font-size:11px;color:var(--sub)}
.appicon.bdg{position:absolute;top:-4px;right:8px;background:#ff4d5e;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;font-weight:700}
#stat-strip{margin:4px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--sub);line-height:1.9}
#stat-strip b{color:var(--txt)}
.bar{height:6px;background:#0a1830;border-radius:99px;overflow:hidden;display:inline-block;width:86px;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* scene */
#scene-body{padding:20px 18px}
.scene-loc{color:var(--accent);font-size:12px;letter-spacing:.08em;margin-bottom:10px}
.scene-text{font-size:15px;line-height:2.05;white-space:pre-wrap}
.scene-text.who{color:var(--accent2);font-weight:700}
.scene-text.cn{color:var(--sub);font-size:13px}
.novel-img{width:100%;border-radius:14px;margin:10px 0;border:1px solid var(--line)}
.big-btn{display:block;width:calc(100% - 36px);margin:16px auto;padding:15px;background:linear-gradient(135deg,#e09543,#c77414);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.ghost-btn{display:block;width:calc(100% - 36px);margin:8px auto;padding:12px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:12px;font-size:14px;cursor:pointer}
.choice-list{padding:6px 18px}
.choice-list button{display:block;width:100%;margin:8px 0;padding:13px 14px;background:#1a3055;border:1px solid #31548c;color:var(--txt);border-radius:12px;font-size:14px;text-align:left;cursor:pointer;line-height:1.6}
.choice-list button:active{background:#24406f}
/* chat */
#chat-list.thread{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(36,64,107,.5);cursor:pointer;align-items:center}
#chat-list.thread.meta{flex:1;min-width:0}
#chat-list.thread.nm{font-weight:700;font-size:15px}
#chat-list.thread.pv{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#chat-list.thread.tm{color:var(--sub);font-size:11px}
.av{width:48px;height:48px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#2a4a7f}
.av-init{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c5f8a,#39d0c4);color:#fff;font-weight:700;font-size:19px}
.av.sm{width:34px;height:34px;font-size:14px}
#chat-body{padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msgrow{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msgrow.me{flex-direction:row-reverse}
.msgcol{display:flex;flex-direction:column;max-width:74%}
.msgrow.me.msgcol{align-items:flex-end}
.msgname{font-size:11px;color:var(--sub);margin:0 2px 3px}
.bubble{padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.65;background:var(--other);border-bottom-left-radius:5px;overflow-wrap:anywhere;flex:0 1 auto}
.msgrow.me.bubble{background:var(--me);color:var(--me-txt);border-radius:16px;border-bottom-right-radius:5px}
.bubble.cn{display:block;color:inherit;opacity:.62;font-size:12px;margin-top:2px}
.voice-bub{display:flex;align-items:center;gap:9px;min-width:150px;cursor:pointer}
.voice-bub.play{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.voice-bub.wave{flex:1;height:18px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px);opacity:.5;border-radius:3px}
.sysmsg{align-self:center;background:rgba(20,40,72,.85);color:var(--sub);font-size:11.5px;padding:5px 12px;border-radius:999px;text-align:center;line-height:1.6}
#chat-inputbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:rgba(10,22,42,.92);position:sticky;bottom:0}
#chat-text{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--txt);padding:10px 14px;font-size:16px;outline:none}
#chat-send{background:var(--accent);border:none;color:#2a2008;font-weight:700;border-radius:999px;padding:0 16px;cursor:pointer;font-size:14px}
#chat-choices{padding:4px 12px 10px}
/* weibo / news */
.post{margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.post.ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post.pn{font-weight:700;font-size:14px}
.post.pt{color:var(--sub);font-size:11px}
.post.pb{font-size:14px;line-height:1.8}
.post.pb.tag{color:#6db3ff}
.post.pf{color:var(--sub);font-size:12px;margin-top:9px;display:flex;gap:18px}
.news-item{margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.news-item.nh{font-weight:700;font-size:15px;line-height:1.6}
.news-item.nm2{color:var(--sub);font-size:11px;margin-top:5px}
.news-item.nb{font-size:13.5px;line-height:1.9;color:#cfe0f5;margin-top:8px;display:none}
.news-item.open.nb{display:block}
/* support room */
.sup-card{margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.sup-card h3{margin:0 0 4px;font-size:15px}
.sup-card p{color:var(--sub);font-size:12.5px;line-height:1.7;margin:0 0 10px}
.sup-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed rgba(36,64,107,.7)}
.sup-row.inf{flex:1;min-width:0}
.sup-row.inf.n{font-size:14px;font-weight:700}
.sup-row.inf.d{font-size:11.5px;color:var(--sub);line-height:1.5}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer}
.stepper.val{font-weight:700;min-width:20px;text-align:center;color:var(--accent)}
#sup-pts{font-size:13px;color:var(--sub);text-align:center;padding-top:6px}
#sup-pts b{color:var(--accent);font-size:16px}
/* ranking */
.rank-note{margin:10px 16px;color:var(--sub);font-size:11.5px;line-height:1.7}
.rank-row{display:flex;align-items:center;gap:11px;margin:0 16px;padding:9px 10px;border-bottom:1px solid rgba(36,64,107,.45)}
.rank-row.rk{width:30px;text-align:center;font-weight:800;font-size:16px;color:var(--sub)}
.rank-row.top3.rk{color:var(--accent)}
.rank-row.inf{flex:1;min-width:0}
.rank-row.inf.n{font-weight:700;font-size:14.5px}
.rank-row.inf.a{color:var(--sub);font-size:11px}
.rank-row.vt{font-size:12px;color:var(--sub);text-align:right}
.rank-row.hero{background:linear-gradient(90deg,rgba(255,184,77,.22),rgba(255,184,77,.05));border:1px solid var(--accent);border-radius:12px;margin-top:6px;margin-bottom:6px}
.rank-row.out{opacity:.55}
.rank-row.tag-out{color:#ff8296;font-size:11px;font-weight:700}
/* members */
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
.mem-cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;color:var(--txt)}
.mem-cell.av,.mem-cell.av-init{width:64px;height:64px;font-size:24px}
.mem-cell span{font-size:12px}
.mem-cell small{color:var(--sub);font-size:10px}
.pf-hero{display:flex;gap:14px;padding:18px;align-items:center}
.pf-hero.av,.pf-hero.av-init{width:84px;height:84px;font-size:32px}
.pf-sec{margin:0 16px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.pf-sec h3{margin:0 0 8px;font-size:13px;color:var(--accent2)}
.pf-sec p{font-size:13.5px;line-height:1.9;margin:0;color:#d7e5f8}
.skill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin:5px 0}
.skill.sn{width:64px}
.skill.bar{flex:1;width:auto;margin:0}
/* call */
#screen-call{background:linear-gradient(180deg,#10294d,#081426);text-align:center}
#call-av-wrap{padding:56px 0 8px;display:flex;justify-content:center}
#call-av-wrap.av,#call-av-wrap.av-init{width:110px;height:110px;font-size:44px}
#call-name{font-size:22px;font-weight:700;margin-top:14px}
#call-status{color:var(--sub);font-size:13px;margin-top:6px}
#call-sub{margin:26px 30px;background:rgba(10,22,42,.75);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.9;min-height:56px}
#call-end{margin:20px auto 0;width:64px;height:64px;border-radius:50%;background:#ff4d5e;border:none;color:#fff;font-size:24px;cursor:pointer;display:block}
/* music bar */
#music-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(8,18,36,.96);border-top:1px solid var(--line);padding:9px 14px;display:none;align-items:center;gap:10px;z-index:8}
#music-bar.on{display:flex}
#music-bar.mt{flex:1;min-width:0}
#music-bar.mt.a{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#music-bar.mt.b{font-size:11px;color:var(--sub)}
#music-toggle{background:var(--accent);border:none;width:38px;height:38px;border-radius:50%;font-size:15px;cursor:pointer;color:#2a2008;flex:0 0 auto}
#music-stop{background:var(--panel2);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;font-size:12px;cursor:pointer;color:var(--txt);flex:0 0 auto}
/* settings etc */
.set-row{display:flex;align-items:center;gap:10px;margin:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.set-row.grow{flex:1}
.set-row input[type=range]{flex:1}
.switch{width:46px;height:26px;border-radius:99px;background:#2a4a7f;border:none;position:relative;cursor:pointer;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent2)}
.switch.on::after{left:23px}
.about-txt{font-size:12.5px;line-height:2;color:var(--sub);padding:0 18px}
.fin-card{margin:26px 16px;background:linear-gradient(160deg,#14315e,#0c1e3a);border:1px solid var(--accent);border-radius:18px;padding:22px 18px;text-align:center}
.fin-card h3{margin:0 0 8px;font-size:19px}
.fin-card p{font-size:13.5px;line-height:1.95;color:#d7e5f8}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(8,18,36,.95);border:1px solid var(--accent);color:var(--txt);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
input,textarea{font-size:16px!important}
</style>
</head>
<body>
<div id="phone">
<div id="sb"><span id="sb-time">19:00</span><span>CHUANG 2021 · 三亜</span><span>📶 🔋</span></div>
<header class="app-head" id="app-head" style="display:none">
<button class="backbtn" id="head-back">‹</button>
<div style="flex:1;min-width:0"><h1 id="head-title">ホーム</h1><div class="sub" id="head-sub"></div></div>
</header>
<main id="main">
<!-- HOME -->
<section class="screen active" id="screen-home">
<div id="home-hero">
<div class="date" id="home-date">2021年2月 · 中国・三亜</div>
<h2 id="home-title">担当をデビューさせる件</h2>
<p id="home-desc">日本人学員サポートスタッフとして『創造営2021』の収録に帯同中。担当は、あの井汲大翔。2年ぶりの再会から、もう一度「デビューさせる」戦いが始まる。</p>
</div>
<div id="story-banner">
<span class="badge" id="story-badge">第1部</span>
<div class="t" id="story-title">ストーリーを進める</div>
<div class="d" id="story-desc">プロローグ：三亜到着</div>
</div>
<div id="stat-strip"></div>
<div id="apps"></div>
<p class="about-txt">※本作品は実在の番組『創造営2021』（2021・テンセント）と実在の人物を題材にしたファンメイドのIF物語です。史実をもとにしていますが、登場人物の言動や順位の変動は創作を含みます。</p>
</section>
<!-- SCENE -->
<section class="screen" id="screen-scene">
<div id="scene-body"></div>
<div class="choice-list" id="scene-choices"></div>
<button class="big-btn" id="scene-next">つづける</button>
</section>
<!-- CHAT LIST -->
<section class="screen" id="screen-chatlist"><div id="chat-list"></div></section>
<!-- CHAT -->
<section class="screen" id="screen-chat">
<div id="chat-body"></div>
<div id="chat-choices"></div>
<div id="chat-inputbar">
<input id="chat-text" type="text" placeholder="メッセージを入力" autocomplete="off">
<button id="chat-send">送信</button>
</div>
</section>
<!-- WEIBO -->
<section class="screen" id="screen-weibo"><div id="weibo-list"></div></section>
<!-- NEWS -->
<section class="screen" id="screen-news"><div id="news-list"></div></section>
<!-- SUPPORT -->
<section class="screen" id="screen-support"><div id="support-body"></div></section>
<!-- RANK -->
<section class="screen" id="screen-rank"><div id="rank-body"></div></section>
<!-- MEMBERS -->
<section class="screen" id="screen-members"><div id="members-body"></div></section>
<!-- PROFILE -->
<section class="screen" id="screen-profile"><div id="pf-body"></div></section>
<!-- CALL -->
<section class="screen" id="screen-call">
<div id="call-av-wrap"></div>
<div id="call-name"></div>
<div id="call-status">通話中…</div>
<div id="call-sub"></div>
<div class="choice-list" id="call-choices"></div>
<button id="call-end">📞</button>
</section>
<!-- SETTINGS -->
<section class="screen" id="screen-settings"><div id="settings-body"></div></section>
</main>
<div id="music-bar">
<div class="mt"><div class="a" id="music-title">—</div><div class="b" id="music-sub">音楽</div></div>
<button id="music-toggle">⏸</button>
<button id="music-stop">✕</button>
</div>
</div>
<div id="toast"></div>
<audio id="music-audio" preload="auto"></audio>
<audio id="voice-audio" preload="auto"></audio>
<script>
"use strict";
/* ================= DATA ================= */
const CAST = {
hiroto:{name:"井汲大翔",sub:"いくみ ひろと｜吉祥弟弟",grp:"RBW JBOYZ",from:"日本・大阪",cls:"B → A → B",sk:{vo:68,da:84,ra:72,vi:88},pop:86,
 prof:"18歳。2019年の日プ無印では36位で脱落し、その後RBWの練習生に。今回は事務所の先輩曲を引っさげて、人生2度目のサバイバルに挑む。本名の中国語読み「Jǐng Jí Dà Xiáng」から「吉祥（縁起がいい）」と同音になるため、愛称は「吉祥弟弟」。学員みんなに可愛がられる“团宠”タイプで、中国語は勉強中。ステージでは表情管理とダンスのキレが武器。",
 rel:"担当学員。前作（2019年・日プ合宿）で「デビューさせる」と交わした約束の、続きの相手。"},
taguchi:{name:"田口馨也",sub:"たぐち けいや",grp:"RBW JBOYZ",from:"日本・茨城",cls:"F（初評級58票）",sk:{vo:62,da:74,ra:55,vi:76},pop:52,
 prof:"18歳。日プ無印では大翔と同じTeam DKの最年少だった。創造営でも同じRBWから参加し、初評級は58票でF班スタート。真面目で素直な末っ子気質は変わらない。",
 rel:"大翔のTeam DK時代からの仲間。日本にいた頃から知る、数少ない“素の大翔”を知る存在。"},
sumida:{name:"隅田隼平",sub:"すみだ じゅんぺい",grp:"RBW JBOYZ",from:"日本・東京",cls:"F（初評級54票）",sk:{vo:70,da:66,ra:60,vi:70},pop:48,
 prof:"JBOYZの最年長お兄さん枠。初評級は54票でF班。歌の安定感と場を和ませる力で、年下2人を引っ張る。",
 rel:"大翔・田口と3人で渡中した同僚。合宿生活の支え。"},
linmo:{name:"林墨",sub:"リン・モー｜Lin Mo",grp:"原際画",from:"中国・重慶",cls:"A → B → A",sk:{vo:74,da:80,ra:66,vi:82},pop:88,
 prof:"19歳。易安音楽社出身の経験者で初評級A班。一公「Lover Boy 88」ではセンターを務め、チームを勝利に導いた。明るく社交的で、初対面でも一気に距離を詰めるタイプ。",
 rel:"一公で大翔と同チーム。センターとして大翔の“撑腰王”獲得を後押しした。"},
jiayuan:{name:"張嘉元",sub:"ジャン・ジアユエン",grp:"哇唧唧哇",from:"中国・遼寧",cls:"C → B → C → A",sk:{vo:72,da:78,ra:64,vi:80},pop:84,
 prof:"18歳。ギターも弾ける音楽好き。一公「Lover Boy 88」では110票を集め、大翔とチーム内トップを争った。素直で感情が顔に出る年下キャラ。",
 rel:"一公のチームメイト。大翔とは同い年コンビで練習でもよく組む。"},
zhangteng:{name:"張騰",sub:"ジャン・トン",grp:"個人学員",from:"中国・河北",cls:"C → B",sk:{vo:66,da:72,ra:58,vi:74},pop:60,

function hirotoClass(){const st=S.step; if(st<8) return "B班"; if(st<12) return "A班"; return "B班";}

if(S.finished){$("#story-badge").textContent="第1部 完"; $("#story-title").textContent="第1部は完結しました"; $("#story-desc").textContent="記録を見返す · 第2部は制作中です";}
else if(step){$("#story-badge").textContent=step.badge||""; $("#story-title").textContent=step.title||"ストーリーを進める"; $("#story-desc").textContent=step.desc||"";}
const unreadW=S.weibo.filter(w=>!S.seenWeibo.includes(w)).length;
const unreadN=S.news.filter(n=>!S.seenNews.includes(n)).length;

const bar=(v)=>`<span class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></span>`;
$("#stat-strip").innerHTML=`担当：<b>井汲大翔</b>（${hirotoClass()}）　愛称：<b>吉祥弟弟</b><br>信頼度 ${bar(S.trust)} ${S.trust}　メンタル ${bar(S.mental)} ${S.mental}<br>注目度 ${bar(S.pop)} ${S.pop}　裏側サポートpt <b>${S.score}</b>${S.rankResult?`<br>第1回順位発表：<b>${S.rankResult.rank}位</b>（${S.rankResult.votes.toLocaleString()}票／史実17位）`:""}`;
}
$("#story-banner").onclick=()=>{ if(S.finished){toast("第1部は完結済みです。第2部をお楽しみに"); return;} startStep();};
/* ---------- steps ---------- */
let pageIdx=0, talkDone=false;
function applyFx(fx){ if(!fx) return; if(fx.trust) S.trust=Math.min(100,S.trust+fx.trust); if(fx.mental) S.mental=Math.min(100,S.mental+fx.mental); if(fx.pop) S.pop=Math.min(100,S.pop+fx.pop); if(fx.score) S.score+=fx.score;}
function completeStep(){ const step=STEPS[S.step];
if(step.addWeibo) step.addWeibo.forEach(w=>{if(!S.weibo.includes(w)) S.weibo.push(w);});
if(step.addNews) step.addNews.forEach(n=>{if(!S.news.includes(n)) S.news.push(n);});
S.step++; S.stepApplied=false; if(S.step>=STEPS.length){S.finished=true;} save(); stopMusic(); goHome();
if(step.addWeibo||step.addNews) toast("新しい投稿・記事が届きました");}
function startStep(){ const step=STEPS[S.step]; if(!step) return;
if(step.type==="scene"||step.type==="stage"){ pageIdx=0; renderScenePage(); show("screen-scene",{t:step.title,s:step.desc}); if(step.music) playTrack(step.music);}
else if(step.type==="talk"){ if(!S.stepApplied){ step.msgs.forEach(m=>S.chats[step.thread].push(m)); S.stepApplied=true; save();} talkDone=false; openChat(step.thread,true);}
else if(step.type==="support"){ renderSupport(step.phase); show("screen-support",{t:step.title,s:step.desc});}
else if(step.type==="call"){ startCall(step);}
else if(step.type==="rank"){ doRank(step);}
else if(step.type==="fin"){ renderFin(); show("screen-scene",{t:"第1部 完",s:"おつかれさまでした"});}
}
function renderScenePage(){ const step=STEPS[S.step]; const pages=step.pages;
$("#scene-body").innerHTML=`<div class="scene-loc">${step.loc||""}</div><div class="scene-text">${pages[pageIdx]}</div>`;
const ch=$("#scene-choices"); ch.innerHTML="";
const last=pageIdx>=pages.length-1;
$("#scene-next").style.display=last?"none":"block";
if(last&&step.choices){ ch.innerHTML=step.choices.map((c,i)=>`<button data-ci="${i}">${esc(c.label)}</button>`).join("");
ch.querySelectorAll("button").forEach(b=>b.onclick=()=>{const c=step.choices[+b.dataset.ci]; applyFx(c.fx); save(); if(c.note||c.replyNote) toast(c.note||c.replyNote); completeStep();});}
else if(last){ $("#scene-next").style.display="block"; $("#scene-next").textContent="すすむ";}
$("#main").scrollTop=0;}
$("#scene-next").onclick=()=>{ const step=STEPS[S.step]; if(!step) return;
if(step.type==="fin"){ S.finished=true; save(); goHome(); return;}
 if(step.type==="rank"){ completeStep(); return;}
if(pageIdx<step.pages.length-1){ pageIdx++; renderScenePage();} else if(!step.choices){ completeStep();}};
/* ---------- chat ---------- */
let curThread=null;
function renderChatList(){ const order=["hiroto","jboyz","loverboy","nihon"];
$("#chat-list").innerHTML=order.map(tid=>{const th=THREADS[tid]; const msgs=S.chats[tid]; const last=msgs[msgs.length-1];
const pv=last?(last.v?`🎙 ${VOICES[last.v].text}`:last.t):"（まだメッセージがありません）";
const av=th.members.length===1?avHTML(th.members[0]):avInitGroup(th);
return `<div class="thread" data-tid="${tid}">${av}<div class="meta"><div class="nm">${th.title}</div><div class="pv">${esc(pv)}</div></div><div class="tm">${msgs.length?"":""}</div></div>`;}).join("");
document.querySelectorAll("#chat-list.thread").forEach(el=>el.onclick=()=>openChat(el.dataset.tid,false));}
function avInitGroup(th){ return `<div class="av-init">${th.title.charAt(0)}</div>`;}
function openChat(tid,isStep){ curThread=tid; const th=THREADS[tid]; renderChat();
show("screen-chat",{t:th.title,s:th.sub});
const step=STEPS[S.step];
const chBox=$("#chat-choices"); chBox.innerHTML="";
if(isStep&&step&&step.type==="talk"&&step.thread===tid&&step.choices&&!talkDone){
chBox.innerHTML=`<div class="choice-list" style="padding:0">${step.choices.map((c,i)=>`<button data-ci="${i}">${esc(c.label)}</button>`).join("")}</div>`;
chBox.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const c=step.choices[+b.dataset.ci];
S.chats[tid].push({f:"me",t:c.label}); if(c.reply) c.reply.forEach(m=>S.chats[tid].push(m)); applyFx(c.fx); talkDone=true; chBox.innerHTML=""; renderChat(); save(); if(c.note) toast(c.note);
setTimeout(()=>completeStep(),650);});}
scrollChat();}
function msgHTML(m,tid){ if(m.f==="sys") return `<div class="sysmsg">${esc(m.t)}</div>`;
const group=THREADS[tid].members.length>1;
if(m.f==="me"){ let inner;
if(m.v) inner=voiceHTML(m.v,true); else inner=`<div class="bubble">${esc(m.t)}</div>`;
return `<div class="msgrow me"><div class="msgcol">${inner}</div></div>`;}
const c=CAST[m.f]; const nm=group?`<div class="msgname">${c?c.name:m.f}</div>`:"";
let inner;
if(m.v) inner=voiceHTML(m.v,false); else inner=`<div class="bubble">${esc(m.t)}${m.cn?`<span class="cn">${esc(m.cn)}</span>`:""}</div>`;
return `<div class="msgrow">${avHTML(m.f,"sm")}<div class="msgcol">${nm}${inner}</div></div>`;}
function voiceHTML(key,me){ const v=VOICES[key]; if(!VOICE_OK[key]) return `<div class="bubble">${esc(v.text)}</div>`;
return `<div class="bubble voice-bub" data-voice="${key}"><span class="play">▶</span><span class="wave"></span><span>${v.label}</span></div>`;}
function renderChat(){ const tid=curThread; $("#chat-body").innerHTML=S.chats[tid].map(m=>msgHTML(m,tid)).join("");
document.querySelectorAll("[data-voice]").forEach(el=>el.onclick=()=>playVoice(el.dataset.voice,el));}
function scrollChat(){ setTimeout(()=>{$("#main").scrollTop=$("#main").scrollHeight;},60);}
const FREE_REPLIES=["うん、聞いてるで","ほんまに？　……ありがとう","中国語で言うたら、なんて言うんやろ","練習、もうちょい頑張るわ","なおさんの声聞いたら落ち着く","今度、食堂でおすすめ聞いてな","……内緒やけど、ちょっとだけ緊張してる","おやすみ、なおさん。また明日"];
$("#chat-send").onclick=sendFree;
$("#chat-text").addEventListener("keydown",e=>{if(e.key==="Enter") sendFree();});
function sendFree(){ const inp=$("#chat-text"); const t=inp.value.trim(); if(!t||!curThread) return; inp.value="";
S.chats[curThread].push({f:"me",t}); renderChat(); scrollChat();
if(curThread==="hiroto"&&S.freeReplies<8){ S.freeReplies++; const r=FREE_REPLIES[Math.floor(Math.random()*FREE_REPLIES.length)];

$("#support-body").innerHTML=`<div class="sup-card"><h3>サポート作戦室（フェーズ${phase}）</h3>

<button class="big-btn" id="sup-confirm" disabled style="opacity:.45">この配分で進める</button>`;

if(supAlloc.weibo>=3) S.pop=Math.min(100,S.pop+5);
save(); toast(`裏側サポート +${pts}pt が大翔の追い風になります`); completeStep();};
upd();}

$("#support-body").innerHTML=`<div class="sup-card"><h3>サポート作戦室</h3><p>ストーリーの節目で、大翔への裏側サポート（通訳・発信・ケア・作戦会議）を配分します。配分は大翔の撑腰値に直結します。</p>${rows||'<p>まだ配分の記録がありません。</p>'}</div>`;

function computeRank(){ const votes=Math.round(4820000 + 54600*S.score);
const rows=FACT_RANK.map(r=>({rank:0,id:r[1],votes:r[2]})); rows.push({rank:0,id:"hiroto",votes});
rows.sort((a,b)=>b.votes-a.votes); rows.forEach((r,i)=>r.rank=i+1);
const hero=rows.find(r=>r.id==="hiroto"); return {votes,rank:hero.rank,rows};}
function rankRowHTML(r){ const isHero=r.id==="hiroto"; const c=CAST[r.id]; const nm=isHero?"井汲大翔":(c?c.name:(EXTRA_NAMES[r.id]||r.id));
const av=isHero||c?avHTML(r.id,"sm"):`<div class="av-init sm">${nm.charAt(0)}</div>`;
return `<div class="rank-row ${r.rank<=3?"top3":""} ${isHero?"hero":""}"><div class="rk">${r.rank}</div>${av}<div class="inf"><div class="n">${nm}${isHero?"（担当）":""}</div><div class="a">${c?c.grp:""}</div></div><div class="vt">${r.votes.toLocaleString()}票</div></div>`;}

playTrack("tension");

<div class="rank-row out"><div class="rk">87</div>${avHTML("sumida","sm")}<div class="inf"><div class="n">隅田隼平</div><div class="a">RBW JBOYZ</div></div><div class="tag-out">離営</div></div></div>
<p class="rank-note">※上位の順位・票数は史実の第1回順位発表（2021年3月20日）に基づきます。大翔の順位・票数は、あなたの裏側サポートによって変動したIFの結果です（史実：17位・6,895,112票）。</p>

呼ばれた。残れた。
でも、隣の椅子に座るはずだった2人の姿は、もうここにはない。</div>`;
$("#scene-choices").innerHTML=""; $("#scene-next").style.display="block"; $("#scene-next").textContent="結果を受け止める";
show("screen-scene",{t:step.title,s:step.desc});}

『担当をデビューさせる件』は、実在の番組『創造営2021』（2021・テンセントビデオ）と実在の人物を題材にしたファンメイドのIF物語です。史実をもとにしていますが、登場人物の言動や順位の変動は創作を含みます。<br>
音楽：課題曲はiTunes公式プレビュー（30秒）を使用しています（HIP -Japanese ver.-／MAMAMOO、Lover Boy 88（纯享版）／進步男孩兒、我們一起闖／創造営2021学員）。順位発表BGM："The Descent" by Kevin MacLeod (CC-BY)。写真はPinterest等で流通している各学員の写真を使用しています（本人の最終確認は実機目視によります）。<br>

<button class="ghost-btn" id="set-reset" style="color:#ff8296">セーブデータを消して最初から</button>`;
$("#set-sound").onclick=e=>{ settings.sound=!settings.sound; e.target.classList.toggle("on",settings.sound); saveSettings(); if(!settings.sound) stopMusic();};
$("#set-vol").oninput=e=>{ settings.vol=+e.target.value/100; saveSettings(); const a=$("#music-audio"); if(a) a.volume=settings.vol;};
$("#set-about").onclick=()=>{ const b=$("#about-box"); b.style.display=b.style.display==="none"?"block":"none";};
$("#set-reset").onclick=()=>{ if(confirm("セーブデータを消して最初からやり直しますか？")){ localStorage.removeItem(SAVE_KEY); S=freshState(); save(); goHome(); toast("データをリセットしました");}};}
function saveSettings(){ localStorage.setItem(SET_KEY,JSON.stringify(settings));}
/* ---------- music & voice ---------- */
const ma=$("#music-audio"), va=$("#voice-audio");
let curTrack=null;
function playTrack(key){ if(!settings.sound) {curTrack=key; return;} const t=TRACKS[key]; if(!t) return; curTrack=key;
ma.src=t.src; ma.loop=!!t.loop; ma.volume=settings.vol; ma.play().catch(()=>{});
$("#music-title").textContent=t.title; $("#music-sub").textContent=t.sub; $("#music-bar").classList.add("on"); $("#music-toggle").textContent="⏸";}
function stopMusic(){ if(ma){ma.pause();} $("#music-bar").classList.remove("on"); curTrack=null;}
$("#music-toggle").onclick=()=>{ if(!curTrack) return; if(ma.paused){ if(!settings.sound){settings.sound=true; saveSettings();} ma.volume=settings.vol; ma.play().catch(()=>{}); $("#music-toggle").textContent="⏸";} else { ma.pause(); $("#music-toggle").textContent="▶";}};
$("#music-stop").onclick=stopMusic;
function playVoice(key,el){ const v=VOICES[key]; if(!v) return; duck(true);
va.src=v.src; va.volume=Math.min(1,settings.vol+0.1); va.play().catch(()=>{duck(false);});
const pl=el?el.querySelector(".play"):null; if(pl) pl.textContent="⏸";
va.onended=()=>{ duck(false); if(pl) pl.textContent="▶";};}
function stopVoice(){ if(va){va.pause();} duck(false);}
function duck(on){ if(curTrack&&ma&&!ma.paused) ma.volume=on?settings.vol*0.25:settings.vol;}
/* ---------- init ---------- */
function tickClock(){ const d=new Date(); $("#sb-time").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
setInterval(tickClock,20000); tickClock();
if(window.visualViewport){ window.visualViewport.addEventListener("resize",()=>{ if(curScreen==="screen-chat") scrollChat();});}
$("#chat-text").addEventListener("focus",()=>{ if(curScreen==="screen-chat") setTimeout(scrollChat,300);});
load();
Object.keys(VOICES).forEach(k=>{ fetch(VOICES[k].src,{method:"HEAD"}).then(r=>{ VOICE_OK[k]=r.ok;}).catch(()=>{ VOICE_OK[k]=false;});});
renderHome();
</script>
</body>
</html>
